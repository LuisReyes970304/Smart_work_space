<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="stylesheet" href="asset/css/style.css">
    <link rel="icon" href="data:," >
</head>
<body>
    <div class="container">
        <div class="deleting">
            <img src="asset/image/arrow.svg" alt="arrow" class="loadingArrow">
            <p>Deleting</p>
        </div>
        <div class="message">
            <p>Are you sure you want to delete this note?</p>
            <button class="yes">YES</button>
            <button class="not">NOT</button>
        </div>
    </div>
    <header>
        <h1>Notes</h1>
    </header>
    <main>
        <figure class="entry">
            <fieldset>
                <legend>Add a note</legend>
                <form method="post">
                    <input type="text" class="input">
                    <input type="submit" value="submit">
                </form>
            </fieldset>
        </figure >
        <figure class="list">
            <h2>These are the notes</h2>
            <ul class="listNotes">
            </ul>
        </figure>
    </main>
    <script type="module" src="js/script.js"></script>
</body>
</html>
